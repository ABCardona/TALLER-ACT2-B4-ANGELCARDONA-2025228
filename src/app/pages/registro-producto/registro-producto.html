<section class="registro">
  <h1>Registro de Producto</h1>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <div class="campo">
      <label for="nombre">Nombre</label>
      <input
        id="nombre"
        type="text"
        formControlName="nombre"
        [class.is-invalid]="esInvalido('nombre')"
        placeholder="Ej. Laptop Gamer"
      />
      <div
        *ngIf="esInvalido('nombre')"
        class="errores"
      >
        <p class="error" *ngFor="let mensaje of obtenerErrores('nombre')">{{ mensaje }}</p>
      </div>
    </div>

    <div class="campo">
      <label for="descripcion">Descripción</label>
      <textarea
        id="descripcion"
        rows="3"
        formControlName="descripcion"
        [class.is-invalid]="esInvalido('descripcion')"
        placeholder="Describir el producto"
      ></textarea>
      <div
        *ngIf="esInvalido('descripcion')"
        class="errores"
      >
        <p class="error" *ngFor="let mensaje of obtenerErrores('descripcion')">{{ mensaje }}</p>
      </div>
    </div>

    <div class="campo">
      <label for="precio">Precio</label>
      <input
        id="precio"
        type="number"
        step="0.01"
        formControlName="precio"
        [class.is-invalid]="esInvalido('precio')"
        placeholder="Ej. 1499.99"
      />
      <div
        *ngIf="esInvalido('precio')"
        class="errores"
      >
        <p class="error" *ngFor="let mensaje of obtenerErrores('precio')">{{ mensaje }}</p>
      </div>
    </div>

    <div class="campo">
      <label for="categoria">Categoría</label>
      <select
        id="categoria"
        formControlName="categoria"
        [class.is-invalid]="esInvalido('categoria')"
      >
        <option value="" disabled>Selecciona una categoría</option>
        <option value="Electrónica">Electrónica</option>
        <option value="Ropa">Ropa</option>
        <option value="Alimentos">Alimentos</option>
        <option value="Hogar">Hogar</option>
        <option value="Juguetes">Juguetes</option>
      </select>
      <div
        *ngIf="esInvalido('categoria')"
        class="errores"
      >
        <p class="error" *ngFor="let mensaje of obtenerErrores('categoria')">{{ mensaje }}</p>
      </div>
    </div>

    <div class="campo">
      <label for="stock">Stock</label>
      <input
        id="stock"
        type="number"
        step="1"
        formControlName="stock"
        [class.is-invalid]="esInvalido('stock')"
        placeholder="Ej. 25"
      />
      <div
        *ngIf="esInvalido('stock')"
        class="errores"
      >
        <p class="error" *ngFor="let mensaje of obtenerErrores('stock')">{{ mensaje }}</p>
      </div>
    </div>

    <button type="submit" class="btn-enviar" [disabled]="registrando">
      {{ registrando ? 'Registrando...' : 'Registrar producto' }}
    </button>
  </form>

  <div *ngIf="formEnviado && form.invalid" class="resumen-errores">
    <h2>El formulario no se pudo enviar. Corrige los siguientes errores:</h2>
    <ul>
      <li *ngFor="let resumen of resumenErrores">{{ resumen }}</li>
    </ul>
  </div>

  <p *ngIf="registrado" class="exito">Producto registrado correctamente.</p>
</section>
